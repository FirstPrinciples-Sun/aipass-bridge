<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aipass bridge</title>
<style>
  :root {
    --bg: #f8fafc;
    --bg-secondary: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #0ea5e9;
    --accent-hover: #0284c7;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --radius: 12px;
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.5), 0 1px 2px -1px rgb(0 0 0 / 0.5);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5), 0 4px 6px -4px rgb(0 0 0 / 0.5);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: white;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 9999px;
    font-size: 13px; font-weight: 500;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.up { background: var(--success); }
  .status-dot.down { background: var(--danger); }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg-secondary); padding: 4px; border-radius: var(--radius); border: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 12px 16px; border-radius: 8px;
    background: transparent; border: none; cursor: pointer;
    color: var(--text-muted); font-weight: 500; font-size: 14px;
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tab:hover { background: var(--border); color: var(--text); }
  .tab.active { background: var(--bg); color: var(--text); box-shadow: var(--shadow); }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Cards */
  .card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }

  /* Forms */
  .form-group { margin-bottom: 20px; }
  .form-group:last-child { margin-bottom: 0; }
  label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: var(--text); }
  .label-hint { font-size: 12px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
  input[type="text"], textarea, select {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.5;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgb(14 165 233 / 0.15);
  }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  select { cursor: pointer; }

  /* Checkbox */
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .checkbox-item label { margin: 0; cursor: pointer; font-weight: 400; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 20px; border-radius: 8px; border: none;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover:not(:disabled) { background: var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-icon { padding: 8px; border-radius: 6px; }

  /* Output */
  .output-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .output-title { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .output-actions { display: flex; gap: 8px; }
  .output {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; min-height: 240px; max-height: 480px; overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .output:empty::before { content: 'Output will appear here…'; color: var(--text-muted); }

  /* Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

  /* Spinner */
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Status cards */
  .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .status-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .status-card-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .status-card-value { font-size: 18px; font-weight: 600; }

  /* Utility */
  .flex { display: flex; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .text-muted { color: var(--text-muted); }
  .text-sm { font-size: 13px; }
  .mb-4 { margin-bottom: 16px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon">A</div>
      <div>
        <h1>aipass bridge</h1>
        <div class="text-sm text-muted">Local bridge to de.aipass.net</div>
      </div>
    </div>
    <div class="status-badge">
      <span id="dot" class="status-dot down"></span>
      <span id="statusText">checking…</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="chat">💬 Chat</button>
    <button class="tab" data-tab="agent">🤖 Agent</button>
    <button class="tab" data-tab="status">📊 Status</button>
  </div>

  <!-- Chat Panel -->
  <div id="chat" class="panel active">
    <div class="card">
      <div class="grid">
        <div class="form-group">
          <label for="chatModel">Model</label>
          <select id="chatModel"></select>
        </div>
        <div class="form-group">
          <label for="chatConversation">Conversation</label>
          <select id="chatConversation">
            <option value="">Most recent</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="chatInput">Message</label>
        <textarea id="chatInput" placeholder="พิมพ์ข้อความที่นี่… (กด Ctrl+Enter เพื่อส่ง)"></textarea>
      </div>
      <div class="flex gap-2">
        <button id="sendChat" class="btn btn-primary">ส่งข้อความ</button>
        <button id="clearChat" class="btn btn-secondary">ล้าง</button>
      </div>
    </div>

    <div class="card">
      <div class="output-header">
        <div class="output-title">Response</div>
        <div class="output-actions">
          <button id="copyChat" class="btn btn-secondary btn-icon" title="Copy">📋</button>
        </div>
      </div>
      <div id="chatOut" class="output"></div>
      <div id="chatSources" class="text-sm text-muted" style="margin-top: 8px;"></div>
    </div>
  </div>

  <!-- Agent Panel -->
  <div id="agent" class="panel">
    <div class="card">
      <div class="form-group">
        <label for="task">Task</label>
        <textarea id="task" placeholder="เช่น สร้างเว็ปขายขนม HTML ธรรมดา"></textarea>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="root">Project root <span class="label-hint">พาธของโปรเจกต์</span></label>
          <input id="root" type="text" value="." placeholder="เช่น D:\Projects\snack-shop">
        </div>
        <div class="form-group">
          <label for="agentModel">Model</label>
          <select id="agentModel"></select>
        </div>
      </div>

      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="apply">
          <label for="apply">Apply changes (เขียนไฟล์จริง)</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="allowRun">
          <label for="allowRun">Allow shell commands</label>
        </div>
      </div>

      <div class="flex gap-2">
        <button id="runAgent" class="btn btn-primary">Run agent</button>
        <button id="clearAgent" class="btn btn-secondary">ล้างผลลัพธ์</button>
      </div>
      <div class="text-sm text-muted" style="margin-top: 8px;">
        Dry run by default — ไฟล์จะถูกเขียนจริงเมื่อเช็ค Apply changes เท่านั้น
      </div>
    </div>

    <div class="card">
      <div class="output-header">
        <div class="output-title">Agent Log</div>
        <div class="output-actions">
          <button id="copyAgent" class="btn btn-secondary btn-icon" title="Copy">📋</button>
        </div>
      </div>
      <div id="agentOut" class="output"></div>
    </div>
  </div>

  <!-- Status Panel -->
  <div id="status" class="panel">
    <div class="status-grid">
      <div class="status-card">
        <div class="status-card-label">Extensions</div>
        <div id="statusExtensions" class="status-card-value">-</div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Active Jobs</div>
        <div id="statusJobs" class="status-card-value">-</div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Default Model</div>
        <div id="statusModel" class="status-card-value text-sm">-</div>
      </div>
      <div class="status-card">
        <div class="status-card-label">Conversation</div>
        <div id="statusConversation" class="status-card-value text-sm">-</div>
      </div>
    </div>

    <div class="card">
      <div class="output-header">
        <div class="output-title">Raw Status</div>
        <div class="output-actions">
          <button id="copyStatus" class="btn btn-secondary btn-icon" title="Copy">📋</button>
        </div>
      </div>
      <pre id="statusOut" class="output" style="min-height: 200px;">loading…</pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// ── Tabs ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach((tab) => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === tab.dataset.tab));
  });
});

// ── Status ──────────────────────────────────────────────────────────────────
async function refreshStatus() {
  try {
    const r = await fetch('/status');
    const s = await r.json();
    const connected = s.extensions > 0;
    $('dot').className = `status-dot ${connected ? 'up' : 'down'}`;
    $('statusText').textContent = connected ? `connected (${s.extensions})` : 'no extension';
    $('statusExtensions').textContent = s.extensions;
    $('statusJobs').textContent = s.activeJobs;
    $('statusModel').textContent = s.defaultModel || '-';
    $('statusConversation').textContent = s.conversation || '-';
    $('statusOut').textContent = JSON.stringify(s, null, 2);
  } catch (err) {
    $('dot').className = 'status-dot down';
    $('statusText').textContent = 'unreachable';
    $('statusOut').textContent = String(err);
  }
}

async function loadModels() {
  try {
    const { data } = await fetch('/v1/models').then((r) => r.json());
    for (const id of ['chatModel', 'agentModel']) {
      const sel = $(id);
      sel.innerHTML = '';
      for (const m of data) {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = `${m.name || m.id}${m.free_credit ? ' [free]' : ''}`;
        sel.append(opt);
      }
    }
  } catch {}
}

// ── Helpers ─────────────────────────────────────────────────────────────────
function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓';
    setTimeout(() => btn.textContent = orig, 1000);
  });
}

function setLoading(btn, loading) {
  btn.disabled = loading;
  const orig = btn.dataset.origText || btn.textContent;
  btn.dataset.origText = orig;
  btn.innerHTML = loading ? '<span class="spinner"></span> Loading…' : orig;
}

// ── Chat ────────────────────────────────────────────────────────────────────
const chatOut = $('chatOut');
const chatSources = $('chatSources');

$('sendChat').addEventListener('click', sendChat);
$('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendChat();
});

async function sendChat() {
  const text = $('chatInput').value.trim();
  if (!text) return;
  const btn = $('sendChat');
  setLoading(btn, true);
  chatOut.textContent = '';
  chatSources.textContent = '';
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        model: $('chatModel').value || undefined,
        stream: true,
        messages: [{ role: 'user', content: text }],
      }),
    });
    if (!res.ok) throw new Error(`bridge returned ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, cut);
        buf = buf.slice(cut + 2);
        const data = frame.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
        if (!data || data === '[DONE]') continue;
        try {
          const evt = JSON.parse(data);
          const delta = evt.choices?.[0]?.delta ?? {};
          if (delta.reasoning_content) chatOut.textContent += '\n' + delta.reasoning_content;
          if (delta.content) chatOut.textContent += delta.content;
        } catch {}
      }
      chatOut.scrollTop = chatOut.scrollHeight;
    }
    chatOut.textContent += '\n';
  } catch (err) {
    chatOut.textContent = `Error: ${err.message}`;
  } finally {
    setLoading(btn, false);
  }
}

$('clearChat').addEventListener('click', () => { chatOut.textContent = ''; chatSources.textContent = ''; });
$('copyChat').addEventListener('click', (e) => copyToClipboard(chatOut.textContent, e.currentTarget));

// ── Agent ───────────────────────────────────────────────────────────────────
const agentOut = $('agentOut');

$('runAgent').addEventListener('click', runAgent);
$('task').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runAgent();
});

async function runAgent() {
  const task = $('task').value.trim();
  if (!task) { alert('กรุณาใส่ task'); return; }
  const btn = $('runAgent');
  setLoading(btn, true);
  agentOut.textContent = '';
  try {
    const res = await fetch('/ui/agent', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        task,
        root: $('root').value || '.',
        apply: $('apply').checked,
        allowRun: $('allowRun').checked,
        model: $('agentModel').value,
      }),
    });
    if (!res.ok) throw new Error(`bridge returned ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, cut);
        buf = buf.slice(cut + 2);
        const dataLine = frame.split('\n').find((l) => l.startsWith('data:'))?.slice(5).trim();
        if (dataLine) {
          try {
            const evt = JSON.parse(dataLine);
            if (evt.type === 'data') agentOut.textContent += evt.text;
            else if (evt.type === 'error') agentOut.textContent += `\n${evt.text}\n`;
            else if (evt.type === 'end') agentOut.textContent += `\n--- done (exit ${evt.code}) ---\n`;
          } catch {}
        }
      }
      agentOut.scrollTop = agentOut.scrollHeight;
    }
  } catch (err) {
    agentOut.textContent = `Error: ${err.message}`;
  } finally {
    setLoading(btn, false);
  }
}

$('clearAgent').addEventListener('click', () => { agentOut.textContent = ''; });
$('copyAgent').addEventListener('click', (e) => copyToClipboard(agentOut.textContent, e.currentTarget));

// ── Status copy ─────────────────────────────────────────────────────────────
$('copyStatus').addEventListener('click', (e) => copyToClipboard($('statusOut').textContent, e.currentTarget));

// ── Init ────────────────────────────────────────────────────────────────────
refreshStatus();
setInterval(refreshStatus, 3000);
loadModels();
</script>
</body>
</html>
